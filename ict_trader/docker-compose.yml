# One-command research deck:  docker compose up   ->  open http://127.0.0.1:8077
# (builds the UI + API into one image; SQLite by default, persisted in the ./data volume).
# The postgres+timescale service is for the pre-live migration target (profile "postgres").
services:
  deck:
    build: { context: ., dockerfile: Dockerfile }   # multi-stage: builds UI + serves API
    environment:
      ICT_TRADER_API_HOST: "0.0.0.0"
    env_file:
      - path: .env
        required: false
    ports: ["8077:8077"]
    volumes: ["./data:/app/data"]

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ict
      POSTGRES_PASSWORD: ict
      POSTGRES_DB: ict
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    profiles: ["postgres"]

  engine:
    build: { context: ., dockerfile: Dockerfile.engine }
    env_file:
      - path: .env
        required: false
    depends_on: [deck]
    profiles: ["engine"]

volumes:
  pgdata: {}
