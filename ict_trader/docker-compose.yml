# Local stack for the research deck. SQLite is the default (no DB container needed); the
# postgres+timescale service is provided for the pre-live migration target — point
# ICT_TRADER_DB_URL at it to use it.
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ict
      POSTGRES_PASSWORD: ict
      POSTGRES_DB: ict
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    profiles: ["postgres"]

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    env_file: [.env]
    environment:
      ICT_TRADER_API_HOST: "0.0.0.0"
    ports: ["8077:8077"]

  engine:
    build: { context: ., dockerfile: Dockerfile.engine }
    env_file: [.env]
    depends_on: [api]

volumes:
  pgdata: {}
