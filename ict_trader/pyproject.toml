[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ict-trader"
version = "0.1.0"
description = "ICT + Quarterly-Theory intraday reversal auto-trader for NQ/ES with a research deck."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Live engine + API + persistence. Kept optional so the pure detectors/backtest
# core can be installed and tested with zero heavy/async deps.
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "websockets>=12.0",
    "tenacity>=8.2",
    "SQLAlchemy>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "uvloop>=0.19; sys_platform != 'win32'",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
# Optional Claude trade-grader (Phase E). The grader imports anthropic lazily and no-ops
# without ANTHROPIC_API_KEY, so this extra is only needed to actually call the model.
llm = [
    "anthropic>=0.40",
]

[project.scripts]
ict-backtest = "ict_trader.backtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ict_trader = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# UP042: we intentionally use (str, Enum) not StrEnum (preserves repr semantics).
# SIM108: explicit if/else is clearer than ternaries in the synthetic test data.
ignore = ["E501", "UP042", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["ict_trader"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection callables are meant to be called in arg defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
packages = ["ict_trader"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "integration: opt-in tests that hit the Tradovate demo API",
]
