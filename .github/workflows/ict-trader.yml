name: ict-trader

# Dedicated CI for the standalone ict_trader project. Scoped to its own subtree so it is
# independent of the root sports-forecasting CI (which lints src/tests only).
on:
  push:
    branches: ["claude/**", main]
    paths: ["ict_trader/**", ".github/workflows/ict-trader.yml"]
  pull_request:
    paths: ["ict_trader/**", ".github/workflows/ict-trader.yml"]

jobs:
  ict-trader:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ict_trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,serve]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy
      - name: pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ict_trader/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: install
        run: npm ci
      - name: typecheck + build
        run: npm run build   # tsc -b && vite build — fails on any TS error
