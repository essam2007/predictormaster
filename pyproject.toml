[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predictormaster"
version = "0.1.0"
description = "Multi-sport probabilistic forecasting and market-efficiency platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "predictormaster"}]
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.1",
    "shap>=0.44",
    "statsmodels>=0.14",
]
nlp = [
    "transformers>=4.40",
    "sentence-transformers>=2.7",
    "bertopic>=0.16",
]
bayes = [
    "pymc>=5.10",
    "arviz>=0.17",
]
serving = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "tritonclient[grpc]>=2.42",
]
pipeline = [
    "prefect>=2.16",
    "great-expectations>=0.18",
    "mlflow>=2.11",
    "feast>=0.36",
]
dashboard = [
    "streamlit>=1.30",
    "plotly>=5.18",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.92",
    "ruff>=0.4",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers -m 'not bench'"
markers = [
    "bench: performance regression harness (run with `pytest -m bench --benchmark-only`)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
