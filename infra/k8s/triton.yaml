apiVersion: apps/v1
kind: Deployment
metadata:
  name: pm-triton
spec:
  replicas: 2
  selector: { matchLabels: { app: pm-triton } }
  template:
    metadata: { labels: { app: pm-triton } }
    spec:
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:24.02-py3
          args:
            - tritonserver
            - --model-repository=/models
            - --strict-model-config=false
            - --log-verbose=0
          ports:
            - { containerPort: 8000, name: http }
            - { containerPort: 8001, name: grpc }
            - { containerPort: 8002, name: metrics }
          resources:
            requests: { cpu: "2", memory: "8Gi", "nvidia.com/gpu": 1 }
            limits:   { cpu: "8", memory: "16Gi", "nvidia.com/gpu": 1 }
          volumeMounts:
            - { name: models, mountPath: /models }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: pm-triton-models }
---
apiVersion: v1
kind: Service
metadata: { name: pm-triton }
spec:
  selector: { app: pm-triton }
  ports:
    - { name: grpc, port: 8001, targetPort: 8001 }
    - { name: http, port: 8000, targetPort: 8000 }
    - { name: metrics, port: 8002, targetPort: 8002 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: pm-triton }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: pm-triton }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Pods
      pods:
        metric: { name: nv_gpu_utilization }
        target: { type: AverageValue, averageValue: "65" }
