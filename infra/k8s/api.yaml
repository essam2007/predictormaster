apiVersion: apps/v1
kind: Deployment
metadata:
  name: pm-api
  labels: { app: pm-api }
spec:
  replicas: 3
  selector:
    matchLabels: { app: pm-api }
  template:
    metadata:
      labels: { app: pm-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/predictormaster/api:latest
          ports: [{ containerPort: 8000 }]
          env:
            - { name: TRITON_URL, value: "pm-triton:8001" }
            - { name: FS_ONLINE_URL, value: "redis://pm-redis:6379/0" }
            - { name: MLFLOW_TRACKING_URI, value: "http://pm-mlflow:5000" }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "2",    memory: "2Gi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: pm-api }
spec:
  selector: { app: pm-api }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: pm-api }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pm-api
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
    - type: Pods
      pods:
        metric: { name: http_request_duration_p95 }
        target: { type: AverageValue, averageValue: "50m" }
